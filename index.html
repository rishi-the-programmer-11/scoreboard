<!DOCTYPE html>
<html>
<head>
  <title>Live Scoreboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<h1>Live Score Board</h1>

<div id="players"></div>

<script>

var firebaseConfig = {
  apiKey: "AIzaSyB-pcntG7bT9sm24R0FYiptGai7aBCt7HE",
  authDomain: "live-broard.firebaseapp.com",
  databaseURL: "https://live-broard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "live-broard",
  storageBucket: "live-broard.firebasestorage.app",
  messagingSenderId: "956089311577",
  appId: "1:956089311577:web:8e5a80cd4f56de6f32ec48"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();

function createPlayerUI(playerNumber) {

  var container = document.createElement("div");
  container.innerHTML = `
    <h2 id="name${playerNumber}">Player ${playerNumber}</h2>
    <h3>Score: <span id="score${playerNumber}">0</span></h3>
    <button onclick="updateScore(${playerNumber},10)">+10</button>
    <button onclick="updateScore(${playerNumber},-10)">-10</button>
    <hr>
  `;

  document.getElementById("players").appendChild(container);

  // Listen for name changes
  database.ref("players/" + playerNumber + "/name")
    .on("value", function(snapshot) {
      document.getElementById("name" + playerNumber)
        .innerText = snapshot.val();
    });

  // Listen for score changes
  database.ref("players/" + playerNumber + "/score")
    .on("value", function(snapshot) {
      document.getElementById("score" + playerNumber)
        .innerText = snapshot.val();
    });
}

function updateScore(playerNumber, value) {
  var ref = database.ref("players/" + playerNumber + "/score");

  ref.once("value").then(function(snapshot) {
    var current = snapshot.val() || 0;
    ref.set(current + value);
  });
}

// Create 4 players automatically
createPlayerUI(1);
createPlayerUI(2);
createPlayerUI(3);
createPlayerUI(4);

</script>

</body>
</html>
