<!DOCTYPE html>
<html>
<head>
  <title>Dojo Points</title>
  
<link rel="icon" sizes="16x16" href="favicon.png">
<link rel="icon" sizes="32x32" href="favicon.png">
<link rel="icon" sizes="96x96" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="icon" href="/favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    .hidden { display: none; }

    /* LOGOUT */
    #logoutBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px;
      background: red;
      color: white;
      border-radius: 8px;
      z-index: 1000;
    }

    /* GRID */
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      padding: 10px;
    }

    /* PLAYER */
    .player-card {
      padding: 15px;
      border-radius: 15px;
    }

    /* ⭐ GOLDEN TEAM */
.golden-section {
  position: relative;
  overflow: hidden;
  padding: 20px;
  margin: 15px;
  border-radius: 20px;
  color: black;

  background: linear-gradient(270deg, #ffd700, #ffb700, #fff2a8, #ffd700);
  background-size: 400% 400%;
  animation: goldFlow 6s ease infinite;
}

/* 🍩 BROWNIE TEAM */
.brownie-section {
  position: relative;
  overflow: hidden;
  padding: 20px;
  margin: 15px;
  border-radius: 20px;

  background: linear-gradient(270deg, #3b2f2f, #5a3e36, #8b5a2b, #3b2f2f);
  background-size: 400% 400%;
  animation: brownieFlow 6s ease infinite;
}

/* 🌊 SMOOTH GRADIENT ANIMATION */
@keyframes goldFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes brownieFlow {
  0% { background-position: 100% 50%; }
  50% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

   /* ⭐ GOLD SPARKLES */
.golden-section::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(white 2px, transparent 2px);
  background-size: 40px 40px;
  animation: sparkleMove 10s linear infinite;
  opacity: 0.25;
}

/* 🍩 SPRINKLES */
.brownie-section::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(pink 2px, transparent 2px),
    radial-gradient(cyan 2px, transparent 2px),
    radial-gradient(yellow 2px, transparent 2px);
  background-size: 40px 40px, 60px 60px, 80px 80px;
  animation: sprinkleMove 12s linear infinite;
  opacity: 0.3;
}

@keyframes sparkleMove {
  from { background-position: 0 0; }
  to { background-position: 200px 200px; }
}

@keyframes sprinkleMove {
  from { background-position: 0 0, 0 0, 0 0; }
  to { background-position: 200px 200px, -200px 200px, 200px -200px; }
}

    /* TEXT */
    h1 { font-size: clamp(24px,5vw,40px); }
    h2 { font-size: clamp(18px,4vw,28px); }

    .score {
      font-size: clamp(30px,6vw,50px);
    }

    /* BUTTONS */
    button {
      padding: 8px;
      margin: 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add { background: green; color: white; }
    .minus { background: red; color: white; }

  </style>
</head>

<body>

<h1>🏆 DOJO POINTS 🏆</h1>

<!-- LOGIN -->
<div id="loginScreen">
  <input id="pin" placeholder="Enter PIN">
  <br><br>
  <button onclick="unlock()">Enter</button>
  <button onclick="viewOnly()">View Only</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <button id="logoutBtn" onclick="logout()">🚪 Logout</button>

  <div class="golden-section">
    <h2>⭐ Golden Glitter Star ⭐</h2>
    <div id="goldenTeam" class="container"></div>
  </div>

  <div class="brownie-section">
    <h2>🍩 Brownie Rainbow Sprinkle Dojo Points 🍩</h2>
    <div id="brownieTeam" class="container"></div>
  </div>

</div>

<script>

// GLOBAL
var currentMode = localStorage.getItem("mode") || "view";

var browniePIN = "1234";
var goldenPIN = "2020";
var adminPIN = "1212";

// FIREBASE
var firebaseConfig = {
  apiKey: "AIzaSyB...",
  authDomain: "live-broard.firebaseapp.com",
  databaseURL: "https://live-broard-default-rtdb.asia-southeast1.firebasedatabase.app",
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// LOGIN
function unlock() {
  var entered = document.getElementById("pin").value.trim();

  if (entered === adminPIN) currentMode = "admin";
  else if (entered === browniePIN) currentMode = "brownie";
  else if (entered === goldenPIN) currentMode = "golden";
  else { alert("Wrong PIN ❌"); return; }

  localStorage.setItem("mode", currentMode);
  startApp();
}

function viewOnly() {
  currentMode = "view";
  localStorage.setItem("mode", currentMode);
  startApp();
}

function logout() {
  localStorage.removeItem("mode");
  location.reload();
}

// START
function startApp() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initPlayers();
}

// CREATE PLAYER
function createPlayer(num) {

  var team = (num <= 2) ? "golden" : "brownie";

  var card = document.createElement("div");
  card.className = "player-card";

  card.innerHTML = `
    <h3 id="name${num}">Player ${num}</h3>
    <div class="score" id="score${num}">0</div>

    <div id="controls${num}">
      <button class="add" onclick="update(${num},1)">+1</button>
      <button class="add" onclick="update(${num},10)">+10</button>
      <button class="minus" onclick="update(${num},-1)">-1</button>
      <button class="minus" onclick="update(${num},-10)">-10</button>
    </div>
  `;

  if (team === "golden") {
    document.getElementById("goldenTeam").appendChild(card);
  } else {
    document.getElementById("brownieTeam").appendChild(card);
  }

  db.ref("players/" + num + "/name").on("value", s => {
    document.getElementById("name" + num).innerText = s.val();
  });

  db.ref("players/" + num + "/score").on("value", s => {
    document.getElementById("score" + num).innerText = s.val();
  });

  if (
    currentMode === "view" ||
    (currentMode === "brownie" && team !== "brownie") ||
    (currentMode === "golden" && team !== "golden")
  ) {
    document.getElementById("controls" + num).style.display = "none";
  }
}

// UPDATE
function update(num, val) {
  if (currentMode === "view") return;

  db.ref("players/" + num + "/score").once("value").then(s => {
    db.ref("players/" + num + "/score").set((s.val() || 0) + val);
  });
}

// INIT
function initPlayers() {
  document.getElementById("goldenTeam").innerHTML = "";
  document.getElementById("brownieTeam").innerHTML = "";

  for (let i = 1; i <= 4; i++) createPlayer(i);
}

// AUTO LOGIN
if (currentMode !== "view") startApp();

</script>

</body>
</html>
