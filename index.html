<!DOCTYPE html>
<html>
<head>
  <title>Dojo Points</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    .hidden { display: none; }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }

    .player-card {
      background: #1e2a38;
      padding: 20px;
      border-radius: 15px;
    }

    .score {
      font-size: 40px;
      margin: 10px;
    }

    button {
      padding: 8px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add { background: green; color: white; }
    .minus { background: red; color: white; }

    input {
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>🏆 DOJO POINTS</h1>

<!-- LOGIN -->
<div id="loginScreen">
  <input id="pin" placeholder="Enter PIN">
  <br><br>
  <button onclick="unlock()">Enter</button>
  <button onclick="viewOnly()">View Only</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <h2>Brownie Rainbow Sprinkle Dojo Points</h2>
  <div id="players" class="container"></div>
</div>

<script>

//////////////////////////////
// 🔐 GLOBAL VARIABLES (FIXED)
//////////////////////////////

var currentMode = localStorage.getItem("mode") || "view";

var browniePIN = "1111";
var goldenPIN = "2222";
var adminPIN = "9999";

//////////////////////////////
// 🔥 FIREBASE
//////////////////////////////

var firebaseConfig = {
  apiKey: "AIzaSyB-pcntG7bT9sm24R0FYiptGai7aBCt7HE",
  authDomain: "live-broard.firebaseapp.com",
  databaseURL: "https://live-broard-default-rtdb.asia-southeast1.firebasedatabase.app",
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

//////////////////////////////
// 🔐 LOGIN
//////////////////////////////

function unlock() {
  var entered = document.getElementById("pin").value.trim();

  if (entered === adminPIN) {
    currentMode = "admin";
  } else if (entered === browniePIN) {
    currentMode = "brownie";
  } else if (entered === goldenPIN) {
    currentMode = "golden";
  } else {
    alert("Wrong PIN ❌");
    return;
  }

  localStorage.setItem("mode", currentMode);
  startApp();
}

function viewOnly() {
  currentMode = "view";
  localStorage.setItem("mode", currentMode);
  startApp();
}

//////////////////////////////
// 🚀 START APP
//////////////////////////////

function startApp() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  initPlayers();
}

//////////////////////////////
// 🧑 CREATE PLAYER
//////////////////////////////

function createPlayer(num) {

  var card = document.createElement("div");
  card.className = "player-card";

  card.innerHTML = `
    <h3 id="name${num}">Player ${num}</h3>
    <div class="score" id="score${num}">0</div>

    <div id="controls${num}">
      <button class="add" onclick="update(${num}, 1)">+1</button>
      <button class="add" onclick="update(${num}, 10)">+10</button>
      <button class="add" onclick="update(${num}, 100)">+100</button>
      <button class="minus" onclick="update(${num}, -1)">-1</button>
    </div>
  `;

  document.getElementById("players").appendChild(card);

  // 🔄 LISTENERS (FIXED)
  db.ref("players/" + num + "/name").on("value", snap => {
    document.getElementById("name" + num).innerText = snap.val();
  });

  db.ref("players/" + num + "/score").on("value", snap => {
    document.getElementById("score" + num).innerText = snap.val();
  });

  // 🔒 PERMISSION CONTROL
  if (
    currentMode === "view" ||
    (currentMode === "brownie" && num > 2) ||
    (currentMode === "golden" && num <= 2)
  ) {
    document.getElementById("controls" + num).style.display = "none";
  }
}

//////////////////////////////
// ➕ UPDATE SCORE
//////////////////////////////

function update(num, val) {
  if (currentMode === "view") return;

  db.ref("players/" + num + "/score").once("value").then(snap => {
    let current = snap.val() || 0;
    db.ref("players/" + num + "/score").set(current + val);
  });
}

//////////////////////////////
// 🎮 INIT PLAYERS
//////////////////////////////

function initPlayers() {
  document.getElementById("players").innerHTML = "";

  createPlayer(1);
  createPlayer(2);
  createPlayer(3);
  createPlayer(4);
}

//////////////////////////////
// 🔁 AUTO LOGIN
//////////////////////////////

if (currentMode !== "view") {
  startApp();
}

</script>

</body>
</html>
