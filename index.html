<!DOCTYPE html>
<html>
<head>
  <title>Dojo Points</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      padding: 20px;
      font-size: 40px;
      letter-spacing: 2px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .player-card {
      background: #1e2a38;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }

    .player-card:hover {
      transform: scale(1.05);
    }

    .name {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 50px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .add {
      background: #28a745;
      color: white;
    }

    .add:hover {
      background: #218838;
    }

    .minus {
      background: #dc3545;
      color: white;
    }

    .minus:hover {
      background: #c82333;
    }
  </style>
</head>
<body>

<h1>🏆 LIVE SCOREBOARD</h1>

<div class="container" id="players"></div>

<script>

var firebaseConfig = {
  apiKey: "AIzaSyB-pcntG7bT9sm24R0FYiptGai7aBCt7HE",
  authDomain: "live-broard.firebaseapp.com",
  databaseURL: "https://live-broard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "live-broard",
  storageBucket: "live-broard.firebasestorage.app",
  messagingSenderId: "956089311577",
  appId: "1:956089311577:web:8e5a80cd4f56de6f32ec48"
};

firebase.initializeApp(firebaseConfig);
var database = firebase.database();

function createPlayerUI(playerNumber) {

  var container = document.createElement("div");
  container.className = "player-card";

  container.innerHTML = `
    <div class="name" id="name${playerNumber}">Player ${playerNumber}</div>
    <div class="score" id="score${playerNumber}">0</div>
    <button class="add" onclick="updateScore(${playerNumber},10)">+10</button>
    <button class="minus" onclick="updateScore(${playerNumber},-10)">-10</button>
  `;

  document.getElementById("players").appendChild(container);

  database.ref("players/" + playerNumber + "/name")
    .on("value", function(snapshot) {
      document.getElementById("name" + playerNumber)
        .innerText = snapshot.val();
    });

  database.ref("players/" + playerNumber + "/score")
    .on("value", function(snapshot) {
      document.getElementById("score" + playerNumber)
        .innerText = snapshot.val();
    });
}

function updateScore(playerNumber, value) {
  var ref = database.ref("players/" + playerNumber + "/score");

  ref.once("value").then(function(snapshot) {
    var current = snapshot.val() || 0;
    ref.set(current + value);
  });
}

createPlayerUI(1);
createPlayerUI(2);
createPlayerUI(3);
createPlayerUI(4);

</script>

</body>
</html>
