<!DOCTYPE html>
<html>
<head>
  <title>Dojo Points</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
      margin: 0;
    }

    h1 { margin-top: 20px; }

    /* 🔐 LOGIN */
    #loginScreen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: #1e2a38;
      padding: 30px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin: 5px;
    }

    .enter { background: green; color: white; }
    .view { background: gray; color: white; }

    /* 🏆 APP */
    #app { display: none; }

    .team-title {
      margin-top: 25px;
      font-size: 24px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .player-card {
      padding: 15px;
      border-radius: 15px;
    }

    .brownie {
      background: linear-gradient(135deg, #5a3e2b, #8b5e3c);
    }

    .golden {
      background: linear-gradient(135deg, #ffd700, #d4af37);
      color: black;
    }

    .score { font-size: 40px; }

    .controls button {
      padding: 6px;
      margin: 3px;
    }

    .add { background: green; color: white; }
    .minus { background: red; color: white; }
  </style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Enter PIN</h2>
    <input type="password" id="pin" placeholder="Enter PIN"><br>
    <button class="enter" onclick="unlock()">Enter</button>
    <button class="view" onclick="viewOnly()">View Only</button>
  </div>
</div>

<!-- 🏆 APP -->
<div id="app">
  <h1>🏆 DOJO SCOREBOARD</h1>

  <h2 class="team-title">🍫 Brownie Rainbow Sprinkle Dojo Points</h2>
  <div class="container" id="brownieTeam"></div>

  <h2 class="team-title">⭐ Golden Glitter Star</h2>
  <div class="container" id="goldenTeam"></div>
</div>

<script>
// 🔥 FIREBASE CONFIG (PUT YOURS HERE)
var firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "YOUR_DB_URL"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// 🔐 PINS
var browniePIN = "1111";
var goldenPIN = "2222";
var adminPIN = "9999";

var currentMode = "view";

// 🚪 LOGIN
function unlock() {
  var entered = document.getElementById("pin").value;

  if (entered === adminPIN) currentMode = "admin";
  else if (entered === browniePIN) currentMode = "brownie";
  else if (entered === goldenPIN) currentMode = "golden";
  else {
    alert("Wrong PIN ❌");
    return;
  }

  startApp();
}

function viewOnly() {
  currentMode = "view";
  startApp();
}

// 🚀 START APP
function startApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  initPlayers();
}

// 🧑 CREATE PLAYER
function createPlayer(num, team) {

  var card = document.createElement("div");
  card.className = "player-card " + team;

  card.innerHTML = `
    <h3 id="name${num}">Player ${num}</h3>
    <div class="score" id="score${num}">0</div>

    <div class="controls">
      <button class="add" onclick="update(${num}, '${team}', 1)">+1</button>
      <button class="add" onclick="update(${num}, '${team}', 10)">+10</button>
      <button class="add" onclick="update(${num}, '${team}', 100)">+100</button>
      <button class="minus" onclick="update(${num}, '${team}', -1)">-1</button>
    </div>
  `;

  // 🎯 CONTROL RULES
  if (currentMode !== team && currentMode !== "admin") {
    card.querySelector(".controls").style.display = "none";
  }

  document.getElementById(team + "Team").appendChild(card);

  // 🟢 SCORE LISTENER
  db.ref("players/" + num + "/score")
    .on("value", snap => {
      document.getElementById("score" + num).innerText = snap.val() || 0;
    });

  // 🔵 NAME LISTENER
  db.ref("players/" + num + "/name")
    .on("value", snap => {
      document.getElementById("name" + num).innerText = snap.val() || "Player " + num;
    });
}

// 🔄 UPDATE SCORE
function update(num, team, val) {

  if (currentMode !== team && currentMode !== "admin") return;

  var ref = db.ref("players/" + num + "/score");

  ref.once("value").then(snap => {
    var current = snap.val() || 0;
    var newScore = current + val;

    if (newScore < 0) newScore = 0;

    ref.set(newScore);
  });
}

// 🚀 INIT
function initPlayers() {
  document.getElementById("brownieTeam").innerHTML = "";
  document.getElementById("goldenTeam").innerHTML = "";

  createPlayer(1, "brownie");
  createPlayer(2, "brownie");

  createPlayer(3, "golden");
  createPlayer(4, "golden");
}
</script>

</body>
</html>
