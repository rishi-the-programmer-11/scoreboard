<!DOCTYPE html>
<html>
<head>
  <title>Dojo Points</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
    }

    .hidden { display: none; }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }

    /* 🍩 Brownie Theme */
    .brownie-card {
      background: linear-gradient(145deg, #3b2f2f, #5a3e36);
      border: 2px solid #8b5a2b;
      animation: brownieGlow 2s infinite alternate;
    }

    @keyframes brownieGlow {
      from { box-shadow: 0 0 10px rgba(139,90,43,0.5); }
      to { box-shadow: 0 0 25px rgba(139,90,43,1); }
    }

    /* ⭐ Golden Theme */
    .golden-card {
      background: linear-gradient(270deg, gold, #ffd700, #ffb700, gold);
      background-size: 600% 600%;
      color: black;
      border: 2px solid gold;
      animation: goldShimmer 4s ease infinite;
    }

    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .player-card {
      padding: 20px;
      border-radius: 15px;
      transition: 0.2s;
    }

    .player-card:hover {
      transform: scale(1.05);
    }

    .score {
      font-size: 40px;
      margin: 10px;
    }

    button {
      padding: 8px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add { background: green; color: white; }
    .minus { background: red; color: white; }

    input {
      padding: 10px;
      font-size: 16px;
    }

    .brownie-title { color: #d2a679; }
    .golden-title { color: gold; }

    img {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<h1>🏆 DOJO POINTS</h1>

<!-- LOGIN -->
<div id="loginScreen">
  <input id="pin" placeholder="Enter PIN">
  <br><br>
  <button onclick="unlock()">Enter</button>
  <button onclick="viewOnly()">View Only</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <button onclick="logout()">🚪 Logout</button>

  <h2 class="golden-title">⭐ Golden Glitter Star</h2>
  <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" width="80">
  <div id="goldenTeam" class="container"></div>

  <h2 class="brownie-title">🍩 Brownie Rainbow Sprinkle Dojo Points</h2>
  <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" width="80">
  <div id="brownieTeam" class="container"></div>

</div>

<script>

//////////////////////
// GLOBAL
//////////////////////

var currentMode = localStorage.getItem("mode") || "view";

var browniePIN = "1111";
var goldenPIN = "2222";
var adminPIN = "9999";

//////////////////////
// FIREBASE
//////////////////////

var firebaseConfig = {
  apiKey: "AIzaSyB-pcntG7bT9sm24R0FYiptGai7aBCt7HE",
  authDomain: "live-broard.firebaseapp.com",
  databaseURL: "https://live-broard-default-rtdb.asia-southeast1.firebasedatabase.app",
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

//////////////////////
// LOGIN
//////////////////////

function unlock() {
  var entered = document.getElementById("pin").value.trim();

  if (entered === adminPIN) currentMode = "admin";
  else if (entered === browniePIN) currentMode = "brownie";
  else if (entered === goldenPIN) currentMode = "golden";
  else {
    alert("Wrong PIN ❌");
    return;
  }

  localStorage.setItem("mode", currentMode);
  startApp();
}

function viewOnly() {
  currentMode = "view";
  localStorage.setItem("mode", currentMode);
  startApp();
}

function logout() {
  localStorage.removeItem("mode");
  location.reload();
}

//////////////////////
// START
//////////////////////

function startApp() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  initPlayers();
}

//////////////////////
// CREATE PLAYER
//////////////////////

function createPlayer(num) {

  // 🔁 swapped teams
  var team = (num <= 2) ? "golden" : "brownie";

  var card = document.createElement("div");
  card.className = "player-card " + (team === "golden" ? "golden-card" : "brownie-card");

  card.innerHTML = `
    <h3 id="name${num}">${team === "golden" ? "⭐" : "🍩"} Player ${num}</h3>
    <div class="score" id="score${num}">0</div>

    <div id="controls${num}">
      <button class="add" onclick="update(${num}, 1)">+1</button>
      <button class="add" onclick="update(${num}, 10)">+10</button>
      <button class="add" onclick="update(${num}, 100)">+100</button>
      <button class="minus" onclick="update(${num}, -1)">-1</button>
    </div>
  `;

  // add to correct section
  if (team === "golden") {
    document.getElementById("goldenTeam").appendChild(card);
  } else {
    document.getElementById("brownieTeam").appendChild(card);
  }

  // firebase listeners
  db.ref("players/" + num + "/name").on("value", snap => {
    document.getElementById("name" + num).innerText = snap.val();
  });

  db.ref("players/" + num + "/score").on("value", snap => {
    document.getElementById("score" + num).innerText = snap.val();
  });

  // permissions
  if (
    currentMode === "view" ||
    (currentMode === "brownie" && team !== "brownie") ||
    (currentMode === "golden" && team !== "golden")
  ) {
    document.getElementById("controls" + num).style.display = "none";
  }
}

//////////////////////
// UPDATE
//////////////////////

function update(num, val) {
  if (currentMode === "view") return;

  db.ref("players/" + num + "/score").once("value").then(snap => {
    let current = snap.val() || 0;
    db.ref("players/" + num + "/score").set(current + val);
  });
}

//////////////////////
// INIT
//////////////////////

function initPlayers() {
  document.getElementById("goldenTeam").innerHTML = "";
  document.getElementById("brownieTeam").innerHTML = "";

  createPlayer(1);
  createPlayer(2);
  createPlayer(3);
  createPlayer(4);
}

//////////////////////
// AUTO LOGIN
//////////////////////

if (currentMode !== "view") startApp();

</script>

</body>
</html>
